name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: pytest
      - name: Dogfood - the strong example suite must score at least 80%
        run: python -m mutagrade examples/pricing.py examples/test_pricing_strong.py --min-score 80
